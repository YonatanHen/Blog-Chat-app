# Production infrastructure as code (spec §7, §12).
# No apps/realtime service: Socket.io runs inside blogchat-api, sharing its process and
# origin, so realtime chat needs no service of its own, no env var, and no CORS. See
# docs/superpowers/specs/2026-07-29-realtime-chat-design.md.
services:
  - type: web
    name: blogchat-api
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    # All services and the Key Value instance MUST share a region: the internal
    # connection URL is only reachable from services inside it.
    region: frankfurt
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # The SPA is baked into this image by apps/server/Dockerfile — there is no
      # separate client service. Path is relative to the WORKDIR.
      - key: CLIENT_DIST
        value: apps/client/dist
      # Generated by Render and never seen by us or the repo.
      - key: SESSION_SECRET
        generateValue: true
      # Set in the dashboard. NEVER committed, NEVER a hardcoded fallback.
      - key: MONGODB_URI
        sync: false
      # Optional: without these the API still boots and uploads report 503, so a
      # deploy is never blocked on having a Cloudinary account. Set all three or
      # none — a partial set is rejected at boot. sync: false means Render
      # prompts for the value and it is never committed.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Only needed for a CUSTOM domain. Left unset, the API falls back to
      # RENDER_EXTERNAL_URL, which Render injects as the service's real URL — so
      # OAuth callbacks are correct on a default onrender.com deploy with no
      # configuration at all. Whatever this resolves to must be registered as
      # https://<origin>/api/v1/auth/google/callback in the Google console.
      - key: PUBLIC_ORIGIN
        sync: false
      # Demo capacity caps. Not secrets — committed on purpose so the deployed
      # limits are visible in the repo rather than only in the dashboard.
      - key: DEMO_MAX_USERS
        value: 20
      - key: DEMO_MAX_POSTS_PER_USER
        value: 3
      - key: DEMO_MAX_COMMENTS_PER_POST
        value: 10
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: blogchat-keyvalue
          property: connectionString

  # Managed addon, not a container we build.
  - type: keyvalue
    name: blogchat-keyvalue
    region: frankfurt
    plan: free
    # EMPTY = no public access. Internal connections ride the private network and
    # are unauthenticated by default, so exposing this publicly would be genuinely
    # dangerous. It is therefore unreachable from a laptop — local dev uses the
    # Compose redis container.
    ipAllowList: []
    # Guards against OOM in 25 MB. With sessions in here, eviction can log a user
    # out early; at demo scale it will not trigger.
    maxmemoryPolicy: allkeys-lru
